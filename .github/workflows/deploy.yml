name: 部署到 Cloudflare Pages

# 触发条件：
#   1) 每次往 main 分支推送（git push）就自动部署
#   2) 也可以在 GitHub 网页的 Actions 页手动点一下触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 部署站点
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 关键一步：GitHub 检出出来的仓库里带着 .git（整个版本历史），
      # 而 site 目录正是要直传到线上的目录。绝不能让它跟着传上去。
      # 所以这里重新拼一个干净目录，只放真正要上线的文件。
      #
      # 做法说明：`for f in *` 在 bash 下不会匹配到隐藏文件，
      # .git / .github / .gitignore 天然被排除。
      # 目标目录放在 runner 的临时目录里（不在工作区内），
      # 避免 `*` 把输出目录自己也匹配进去造成自我复制。
      - name: 生成干净的上线目录
        run: |
          DIST="$RUNNER_TEMP/dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          for f in *; do
            cp -r "$f" "$DIST/"
          done
          echo "--- 上线内容 ---"
          ls -la "$DIST"

          echo "--- 安全检查 ---"
          if [ -e "$DIST/.git" ]; then
            echo "::error::.git 被复制进上线目录，已中止部署"
            exit 1
          fi
          if [ -e "$DIST/.github" ]; then
            echo "::error::.github 被复制进上线目录，已中止部署"
            exit 1
          fi
          echo ".git / .github 均未泄漏 ✓"

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/dist" --project-name=radina --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
