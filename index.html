// ===== 活动积分账本（贡献墙真实数据源）=====
var activityLog = (function(){
  var STORAGE_KEY = 'my_activity_log';
  var log = {};  // { 'section-id': { weight: 2, days: { '2026-8-12': 2 } } }

  // 栏目权重（每次编辑的积分）
  var WEIGHTS = {
    project: 2, note: 2,
    resource: 1, murmur: 1, skill: 1, experience: 1, journal: 1
  };

  // 每篇每天最多加分次数（技能/经历/日志每天最多1次）
  var MAX_PER_DAY = {
    project: 2, note: 2,
    resource: 2, murmur: 2,
    skill: 1, experience: 1, journal: 1
  };

  function load() {
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored) { log = JSON.parse(stored); }
    } catch(e) { log = {}; }
    if (typeof log !== 'object' || log === null) log = {};
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); } catch(e) {}
  }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  function makeKey(section, id) {
    return section + '-' + id;
  }

  // 编辑加分：每篇每天封顶次数按栏目配置
  function recordEdit(id, section) {
    if (id === undefined || id === null) return;
    var weight = WEIGHTS[section] || 1;
    var maxPerDay = MAX_PER_DAY[section] || 2;
    var key = makeKey(section, id);
    if (!log[key]) log[key] = { weight: weight, days: {} };
    var t = todayKey();
    var cnt = log[key].days[t] || 0;
    if (cnt >= maxPerDay) return;  // 封顶：每篇每天最多 N 次
    log[key].days[t] = cnt + 1;
    save();
    if (typeof window.refreshContribution === 'function') window.refreshContribution();
  }

  // 删除文章：抹掉该文章全部历史积分
  function removeArticle(id, section) {
    if (id === undefined || id === null) return;
    var key = makeKey(section, id);
    if (log[key]) {
      delete log[key];
      save();
      if (typeof window.refreshContribution === 'function') window.refreshContribution();
    }
  }

  // 计算每天的积分总和 { '2026-8-12': 5 }
  function getDailyScores() {
    var scores = {};
    for (var key in log) {
      var entry = log[key];
      if (!entry || !entry.days) continue;
      var weight = entry.weight || 1;
      for (var date in entry.days) {
        var n = entry.days[date] || 0;
        scores[date] = (scores[date] || 0) + weight * n;
      }
    }
    return scores;
  }

  // 生成栏目内唯一 ID
  function genId(prefix) {
    return (prefix || 'id') + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
  }

  load();

  return {
    recordEdit: recordEdit,
    removeArticle: removeArticle,
    getDailyScores: getDailyScores,
    genId: genId,
    WEIGHTS: WEIGHTS,
    load: load
  };
})();

// Contribution graph
(function(){
  var currentYear = new Date().getFullYear();  // 默认显示当前年份，跨年自动刷新
  var startYear = 2026;  // 最早可查看的年份（网站启用年）
  var contribYear = document.getElementById('contribYear');
  var contribYearLabel = document.getElementById('contribYearLabel');
  var yearDropdown = document.getElementById('yearDropdown');
  var contribGrid = document.getElementById('contribGrid');
  var contribMonths = document.getElementById('contribMonths');
  var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Build year dropdown
  var today = new Date();
  var maxYear = today.getFullYear();
  for (var y = maxYear; y >= startYear; y--) {
    var item = document.createElement('div');
    item.className = 'year-dropdown-item' + (y === currentYear ? ' active' : '');
    item.textContent = y;
    item.addEventListener('click', (function(year){
      return function(e){
        e.stopPropagation();
        currentYear = year;
        contribYearLabel.textContent = year;
        yearDropdown.classList.remove('show');
        contribYear.classList.remove('open');
        renderGrid();
        // update active
        var items = yearDropdown.querySelectorAll('.year-dropdown-item');
        for (var i = 0; i < items.length; i++) {
          items[i].classList.toggle('active', parseInt(items[i].textContent) === year);
        }
      };
    })(y));
    yearDropdown.appendChild(item);
  }

  contribYear.addEventListener('click', function(e){
    e.stopPropagation();
    contribYear.classList.toggle('open');
    yearDropdown.classList.toggle('show');
  });
  document.addEventListener('click', function(){
    yearDropdown.classList.remove('show');
    contribYear.classList.remove('open');
  });

  function renderGrid() {
    contribGrid.innerHTML = '';
    contribMonths.innerHTML = '';

    // 从活动账本读取真实积分
    var year = currentYear;
    var scores = activityLog.getDailyScores();

    // 断崖法：找 100% 基准（该年非零积分，剔除异常高的一段）
    var values = [];
    for (var sk in scores) {
      if (parseInt(sk.split('-')[0]) === year && scores[sk] > 0) values.push(scores[sk]);
    }
    values.sort(function(a,b){ return b-a; });
    var maxScore = values.length > 0 ? values[0] : 0;
    // 断崖法：cur > 15 且落差 >= 1.5 倍，取落差最大的位置作为分界
    var bestRatio = -1;
    for (var vi = 0; vi < values.length - 1; vi++) {
      var cur = values[vi], next = values[vi+1];
      if (cur > 15 && cur >= next * 1.5) {
        var ratio = cur / next;
        if (ratio > bestRatio) { bestRatio = ratio; maxScore = next; }
      }
    }

    function scoreToLevel(score) {
      if (!score || score <= 0 || maxScore <= 0) return 0;
      var pct = score / maxScore * 100;
      if (pct <= 25) return 1;
      if (pct <= 50) return 2;
      if (pct <= 75) return 3;
      return 4;
    }

    // Build weeks starting from the Sunday of the week containing Jan 1
    var firstDay = new Date(year, 0, 1);
    var firstSunday = new Date(firstDay);
    firstSunday.setDate(firstSunday.getDate() - firstSunday.getDay());

    // Compute last Saturday on or after Dec 31 so the year fully fills columns
    var lastDay = new Date(year, 11, 31);
    var lastSaturday = new Date(lastDay);
    lastSaturday.setDate(lastSaturday.getDate() + (6 - lastSaturday.getDay()));

    var months = [];
    var weeks = [];
    var curDate = new Date(firstSunday);
    var lastMonth = -1;

    while (curDate <= lastSaturday) {
      weeks.push(new Date(curDate));
      // Check if ANY day in this week (Sun-Sat) is the 1st of a month
      for (var dow2 = 0; dow2 < 7; dow2++) {
        var checkDate = new Date(curDate);
        checkDate.setDate(checkDate.getDate() + dow2);
        if (checkDate.getDate() === 1 && checkDate.getMonth() !== lastMonth) {
          months.push({ index: weeks.length - 1, month: checkDate.getMonth() });
          lastMonth = checkDate.getMonth();
          break;
        }
      }
      curDate.setDate(curDate.getDate() + 7);
    }

    // Months labels — build with same column structure as grid
    var monthSlots = [];
    for (var w = 0; w < weeks.length; w++) {
      var slot = document.createElement('span');
      slot.className = 'contribution-month-slot';
      monthSlots.push(slot);
    }
    // Place month labels in the correct slots
    for (var i = 0; i < months.length; i++) {
      var label = document.createElement('span');
      label.className = 'contribution-month-label';
      label.textContent = monthNames[months[i].month];
      monthSlots[months[i].index].appendChild(label);
    }
    contribMonths.innerHTML = '';
    for (var s = 0; s < monthSlots.length; s++) {
      contribMonths.appendChild(monthSlots[s]);
    }

    // Build grid
    for (var w = 0; w < weeks.length; w++) {
      var weekDiv = document.createElement('div');
      weekDiv.className = 'contribution-week';
      for (var dow = 0; dow < 7; dow++) {
        var cellDate = new Date(firstSunday);
        cellDate.setDate(cellDate.getDate() + w * 7 + dow);
        var cell = document.createElement('div');
        cell.className = 'contribution-cell';
        if (cellDate.getFullYear() === year) {
          var ckey = cellDate.getFullYear() + '-' + (cellDate.getMonth()+1) + '-' + cellDate.getDate();
          var sc = scores[ckey] || 0;
          var level = scoreToLevel(sc);
          cell.classList.add('l' + level);
          var levelNames = ['无记录','浅蓝','中蓝','深蓝','更深蓝'];
          cell.title = cellDate.getMonth() + 1 + '/' + cellDate.getDate() + '：' + sc + ' 分（' + levelNames[level] + '）';
        } else {
          cell.classList.add('out-of-year');
        }
        weekDiv.appendChild(cell);
      }
      contribGrid.appendChild(weekDiv);
    }
  }

  renderGrid();
  // 暴露刷新函数，供埋点后实时更新贡献墙
  window.refreshContribution = renderGrid;
})();

  function getTimeAgo(dateStr) {

    if (diff < 0) return '今天';
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff < 7) return diff + ' 天前';
    if (diff < 30) return Math.floor(diff / 7) + ' 周前';
    if (diff < 365) return Math.floor(diff / 30) + ' 个月前';
    return Math.floor(diff / 365) + ' 年前';

    for (var i = 0; i < items.length; i++) {
      var p = items[i];
      var card = document.createElement('div');
      card.className = 'project-card glass' + (p.pinned ? ' pinned-card' : '');
      card.setAttribute('data-id', p.id);
      var bodyHTML = p.body || p.note || '';
      var imgSrc = '';
      if (bodyHTML) {
        var imgMatch = bodyHTML.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (imgMatch) imgSrc = imgMatch[1];

      var bodyText = bodyHTML.replace(/<[^>]*>/g, '');

      card.innerHTML =
        '<div class="project-card-actions">' +
          (p.pinned ? '<button class="project-card-top" data-id="' + p.id + '" title="提到最前"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg></button>' : '') +
          '<button class="project-card-pin' + (p.pinned ? ' active' : '') + '" data-id="' + p.id + '" title="' + (p.pinned ? '取消置顶' : '置顶') + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>' +
          '<button class="project-card-edit" data-id="' + p.id + '" title="编辑">&#x270E;</button>' +
          '<button class="project-card-del" data-id="' + p.id + '" title="删除">&#x2715;</button>' +
        '</div>' +
        '<div class="project-card-title">' + escapeHtml(p.title) + '</div>' +
        '<div class="project-card-body">' + imgBlock + escapeHtml(bodyText) + '</div>' +
        '<div class="project-card-footer">' +
          '<span class="project-card-date">' + escapeHtml(formatDateRange(p)) + '</span>' +
          '<div class="project-card-tags">' + (p.tags || []).map(function(t){ return '<span class="project-card-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
        '</div>';
      card.addEventListener('click', function(pid){
        return function(e){
          if (e.target.closest('.project-card-edit') || e.target.closest('.project-card-del') || e.target.closest('.project-card-pin') || e.target.closest('.project-card-top')) return;
          if (this.classList.contains('expanded')) return;
          expandCard(pid);
        };
      }(p.id));
      grid.appendChild(card);
    }

    var editBtns = grid.querySelectorAll('.project-card-edit');
    for (var j = 0; j < editBtns.length; j++) {
      editBtns[j].addEventListener('click', function(e){
        e.stopPropagation();
        expandCard(parseInt(this.getAttribute('data-id')), true);
      });
    }
    var delBtns = grid.querySelectorAll('.project-card-del');
    for (var k = 0; k < delBtns.length; k++) {
      delBtns[k].addEventListener('click', function(e){
        e.stopPropagation();
        deleteItem(parseInt(this.getAttribute('data-id')));
      });
    }
    var pinBtns = grid.querySelectorAll('.project-card-pin');
    for (var l = 0; l < pinBtns.length; l++) {
      pinBtns[l].addEventListener('click', function(e){
        e.stopPropagation();
        togglePin(parseInt(this.getAttribute('data-id')));
      });
    }
    var topBtns = grid.querySelectorAll('.project-card-top');
    for (var m = 0; m < topBtns.length; m++) {
      topBtns[m].addEventListener('click', function(e){
        e.stopPropagation();
        moveToTop(parseInt(this.getAttribute('data-id')));
      });
    }

  }

  // Render photo grid for the photo wall section
  function renderPhotoGrid() {
    var grid = getGrid();
    if (!grid) return;
    grid.innerHTML = '';
    var photos = photoWall.getPhotos();
    var coverIdx = photoWall.getCoverIndex();

    if (photos.length === 0) {
      grid.innerHTML = '<div class="photo-wall-empty">还没有照片，点击右上角蓝色区域上传，或点击上方「+ 上传」按钮</div>';
      return;
    }

    for (var i = 0; i < photos.length; i++) {
      var card = document.createElement('div');
      card.className = 'photo-wall-item glass';
      var isCover = (i === coverIdx);
      var coverBadge = isCover ? '<span class="photo-cover-badge">封面</span>' : '';
      var setCoverBtn = '<button class="photo-cover-btn" onclick="event.stopPropagation();photoWall.setCover(' + i + ')">设为封面</button>';
      card.innerHTML = '<img src="' + photos[i] + '" alt="photo">' + coverBadge + setCoverBtn + '<button class="photo-wall-item-del" onclick="event.stopPropagation();photoWall.removePhoto(' + i + ')">&times;</button>';
      grid.appendChild(card);
    }
  }

  // Expand a card to show full detail inline
  function expandCard(id, startEdit) {
    var p = findItem(id);
    if (!p) return;
    currentProjectId = id;
    isEditing = !!startEdit;

    var grid = getGrid();
    grid.classList.add('has-expanded');
    var cards = grid.querySelectorAll('.project-card');
    for (var i = 0; i < cards.length; i++) {
      if (parseInt(cards[i].getAttribute('data-id')) === id) {
        cards[i].classList.add('expanded');
        fillExpandedCard(cards[i], p, isEditing);
      } else {
        cards[i].style.display = 'none';
      }
    }
  }

  // Collapse expanded card back to grid
  function collapseCard() {
    if (!isEditMode) document.body.classList.remove('edit-mode');
    var grid = getGrid();
    grid.classList.remove('has-expanded');
    var cards = grid.querySelectorAll('.project-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.remove('expanded');
      cards[i].style.display = '';
    }
    currentProjectId = null;
    isEditing = false;
    renderGrid();
  }

  // Fill an expanded card with detail content

    card.innerHTML =
      '<div class="project-card-expand-header">' +
        '<button class="project-card-expand-back" onclick="event.stopPropagation();goBackToGrid(this)" style="cursor:pointer;">&#x2190;</button>' +
        '<span style="font-size:18px;font-weight:900;color:var(--text-primary);">' + escapeHtml(p.title) + '</span>' +
        '<label class="word-import-btn" title="导入文档">导入文档<input type="file" id="wordFileInput" accept=".docx,.pdf"></label>' +
      '</div>' +
      '<div class="project-detail-hero glass">' +
        '<div class="project-detail-title" id="detailDisplayTitle">' + escapeHtml(p.title) + '</div>' +
        '<div class="project-detail-meta">' +
          '<span class="project-detail-date" id="detailDisplayDate">' + escapeHtml(formatDateRange(p)) + '</span>' +
          '<div class="project-detail-tags" id="detailDisplayTags">' + tagsHtml + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="wysiwyg-toolbar" id="wysiwygToolbar">' +
        '<span class="wysiwyg-fmt">' +

        '<button data-cmd="italic" title="斜体"><i>I</i></button>' +

        '<button data-cmd="formatBlock" data-arg="p" title="段落">P</button>' +
        '<span class="wysiwyg-sep"></span>' +
        '<button data-cmd="insertUnorderedList" title="无序列表">&#x25CF;</button>' +
        '<button data-cmd="insertOrderedList" title="有序列表">1.</button>' +
        '<span class="wysiwyg-sep"></span>' +
        '<button data-cmd="justifyLeft" title="左对齐">&#x2261;L</button>' +
        '<button data-cmd="justifyCenter" title="居中">&#x2261;C</button>' +
        '<button data-cmd="justifyRight" title="右对齐">R&#x2261;</button>' +
        '<span class="wysiwyg-sep"></span>' +
        '<button data-cmd="fontSize" data-arg="2" title="小号字体" style="font-size:11px;font-weight:700;">A</button>' +
        '<button data-cmd="fontSize" data-arg="4" title="正常字体" style="font-size:13px;font-weight:700;">A</button>' +
        '<button data-cmd="fontSize" data-arg="5" title="大号字体" style="font-size:15px;font-weight:700;">A</button>' +
        '<span class="wysiwyg-sep"></span>' +
        '<input type="color" id="wysiwygColor" value="#1E1B4B" title="取色器" style="width:22px;height:22px;border:1px solid rgba(148,163,184,0.3);border-radius:4px;cursor:pointer;padding:0;background:transparent;">' +
        colorPalette.renderHTML() +
        '</span>' +
        '<div style="margin-left:auto;display:flex;gap:6px;align-items:center;">' +
          '<div class="project-expand-actions" id="expandActions">' +
            '<button class="project-expand-edit-btn" id="expandEditBtn">&#x270E; 编辑</button>' +
            '<button class="project-expand-del-btn" id="expandDelBtn">&#x1F5D1; 删除</button>' +
          '</div>' +
          '<div class="project-inline-edit-actions" id="expandEditActions" style="display:none;">' +
            '<button class="project-editor-cancel" id="expandEditCancel">取消</button>' +
            '<button class="project-editor-save" id="expandEditSave">保存</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="project-detail-body" id="detailDisplayBody">' + (p.body || '<p>暂无详细内容</p>') + '</div>';

    // Bind back button (uses onclick attr)
    

    // Bind edit button
    card.querySelector('#expandEditBtn').addEventListener('click', function(e){
      e.stopPropagation();
      enterExpandEditMode(card, p);
    });

    // Bind delete button
    card.querySelector('#expandDelBtn').addEventListener('click', function(e){
      e.stopPropagation();
      deleteExpandItem(currentProjectId);
    });

    // Bind save - save and exit edit mode
    card.querySelector('#expandEditSave').addEventListener('click', function(e){
      e.stopPropagation();
      saveExpandEdits(card, p);
      exitExpandEditMode(card, p);
    });

    // Bind cancel
    card.querySelector('#expandEditCancel').addEventListener('click', function(e){
      e.stopPropagation();
      exitExpandEditMode(card, p);
    });

    // Bind toolbar buttons
    var toolbarBtns = card.querySelectorAll('#wysiwygToolbar button');
    for (var tb = 0; tb < toolbarBtns.length; tb++) {
      toolbarBtns[tb].addEventListener('click', function(e){
        e.stopPropagation();
        var cmd = this.getAttribute('data-cmd');
        var arg = this.getAttribute('data-arg') || null;
        document.execCommand(cmd, false, arg);
        // Ensure body stays focused
        card.querySelector('#detailDisplayBody').focus();
      });
    }

    // If starting in edit mode
    if (editMode) {
      enterExpandEditMode(card, p);
    }
  }

  function enterExpandEditMode(card, p) {
    isEditing = true;
    document.body.classList.add('edit-mode');

    // Title: make contenteditable
    var titleEl = card.querySelector('#detailDisplayTitle');
    titleEl.contentEditable = 'true';
    titleEl.focus();

    // Date: replace with two date inputs (start ~ end)
    var dateEl = card.querySelector('#detailDisplayDate');
    dateEl.style.display = 'none';
    var dateWrap = document.createElement('span');
    dateWrap.className = 'project-detail-date-range';
    dateWrap.id = 'detailEditDateWrap';
    var dateStartInput = document.createElement('input');
    dateStartInput.type = 'date';
    dateStartInput.className = 'project-detail-date-input';
    dateStartInput.id = 'detailEditDateStart';
    dateStartInput.value = p.dateStart || p.date || '';
    var dateSep = document.createElement('span');
    dateSep.textContent = ' ~ ';
    dateSep.style.cssText = 'font-size:12px;color:var(--text-muted);';
    var dateEndInput = document.createElement('input');
    dateEndInput.type = 'date';
    dateEndInput.className = 'project-detail-date-input';
    dateEndInput.id = 'detailEditDateEnd';
    dateEndInput.value = p.dateEnd || p.date || '';
    dateWrap.appendChild(dateStartInput);
    dateWrap.appendChild(dateSep);
    dateWrap.appendChild(dateEndInput);
    dateEl.parentNode.insertBefore(dateWrap, dateEl.nextSibling);

    // Tags: replace with input
    var tagsEl = card.querySelector('#detailDisplayTags');
    tagsEl.style.display = 'none';
    var tagsInput = document.createElement('input');
    tagsInput.type = 'text';
    tagsInput.className = 'project-detail-tags-input';
    tagsInput.id = 'detailEditTags';
    tagsInput.value = (p.tags || []).join(', ');
    tagsEl.parentNode.insertBefore(tagsInput, tagsEl.nextSibling);

    // Desc: make contenteditable (removed from display)
    var descEl = card.querySelector('#detailDisplayDesc');
    if (descEl) descEl.contentEditable = 'true';

    // Body: make contenteditable
    var bodyEl = card.querySelector('#detailDisplayBody');
    bodyEl.contentEditable = 'true';

    // Toggle action buttons
    card.querySelector('#expandActions').style.display = 'none';
    card.querySelector('#expandEditActions').style.display = 'flex';
  }

  function exitExpandEditMode(card, p) {
    isEditing = false;
    if (!isEditMode) document.body.classList.remove('edit-mode');

    // Remove edit inputs
    var editIds = ['detailEditDateWrap','detailEditTags'];
    for (var i = 0; i < editIds.length; i++) {
      var el = card.querySelector('#' + editIds[i]);
      if (el) el.remove();
    }

    // Restore date and tags visibility
    var dateEl = card.querySelector('#detailDisplayDate');
    if (dateEl) dateEl.style.display = '';
    var tagsEl = card.querySelector('#detailDisplayTags');
    if (tagsEl) tagsEl.style.display = '';

    // Re-render with fresh data
    fillExpandedCard(card, p, false);
  }

  function saveExpandEdits(card, p) {
    // Read title from contenteditable
    var titleEl = card.querySelector('#detailDisplayTitle');
    var title = titleEl ? titleEl.innerText.trim() : '';

    // Read dates from inputs
    var dateStartInput = card.querySelector('#detailEditDateStart');
    var dateEndInput = card.querySelector('#detailEditDateEnd');
    var dateStart = dateStartInput ? dateStartInput.value : (p.dateStart || p.date || '');
    var dateEnd = dateEndInput ? dateEndInput.value : (p.dateEnd || p.date || '');

    // Read tags from input
    var tagsInput = card.querySelector('#detailEditTags');
    var tagsStr = tagsInput ? tagsInput.value.trim() : '';
    var tags = tagsStr ? tagsStr.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];

    // Read desc from contenteditable
    var descEl = card.querySelector('#detailDisplayDesc');
    var desc = descEl ? descEl.innerHTML.trim() : '';

    // Read body from contenteditable
    var bodyEl = card.querySelector('#detailDisplayBody');
    var body = bodyEl ? bodyEl.innerHTML.trim() : '';

    if (!title) { alert('请输入标题'); return; }
    if (!dateStart) { dateStart = new Date().toISOString().split('T')[0]; }
    if (!dateEnd) { dateEnd = dateStart; }

    p.title = title;
    p.dateStart = dateStart;
    p.dateEnd = dateEnd;
    delete p.date;
    p.tags = tags;
    p.desc = desc;
    p.body = body;
    p.lastModified = new Date().toISOString();
    delete p._isNew;  // 清除新建标记
    saveSectionData(currentSection);
    isEditing = false;
    document.body.classList.remove('edit-mode');
    fillExpandedCard(card, p, false);
    // 埋点：新建和编辑都加分
    activityLog.recordEdit(p.id, currentSection);
  }

  function deleteExpandItem(id) {
    data[currentSection] = getData().filter(function(p){ return p.id !== id; });
    saveSectionData(currentSection);
    // 埋点：删除抹掉该文章全部历史积分
    activityLog.removeArticle(id, currentSection);
    document.body.classList.remove('edit-mode');
    getGrid().classList.remove('has-expanded');
    currentProjectId = null;
    isEditing = false;
    renderGrid();
  }

  function deleteItem(id) {
    data[currentSection] = getData().filter(function(p){ return p.id !== id; });
    saveSectionData(currentSection);
    // 埋点：删除抹掉该文章全部历史积分
    activityLog.removeArticle(id, currentSection);
    renderGrid();
  }

  // 置顶/取消置顶
  function togglePin(id) {
    var p = findItem(id);
    if (!p) return;
    p.pinned = !p.pinned;
    if (p.pinned) { p.pinTime = Date.now(); } else { delete p.pinTime; }
    saveSectionData(currentSection);
    renderGrid();
  }

  // 提到最前（置顶组内排最前）
  function moveToTop(id) {
    var p = findItem(id);
    if (!p) return;
    p.pinned = true;
    p.pinTime = Date.now();
    saveSectionData(currentSection);
    renderGrid();
  }

  function createNewItem() {
    var today = new Date().toISOString().split('T')[0];
    var nid = nextId[currentSection];
    if (typeof nid !== 'number' || isNaN(nid)) nid = 1;
    var newItem = {
      id: nid,
      title: '新建',
      dateStart: today,
      dateEnd: today,
      tags: [],
      desc: '',
      body: '',
      lastModified: new Date().toISOString(),
      _isNew: true  // 标记：新建，第一次保存不加分
    };
    nextId[currentSection] = nid + 1;
    getData().unshift(newItem);
    saveSectionData(currentSection);
    renderGrid();
    expandCard(newItem.id, true);
  }

  function formatDateRange(p) {
    var s = p.dateStart || p.date || '';
    var e = p.dateEnd || p.date || '';
    if (!s && !e) return '';
    if (s === e) return s;
    return s + ' ~ ' + e;
  }

  function findItem(id) {
    var items = getData();
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
    return null;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Load initial data for the section (called when section is first shown)
  function loadSection(sectionKey, itemId) {
    if (sectionKey === 'photos' || sectionKey === 'skill' || sectionKey === 'aboutme' || sectionKey === 'experience' || sectionKey === 'journal') {
      showSection(sectionKey);
      return;
    }
    if (!data[sectionKey] || data[sectionKey].length === 0) {
      loadSectionData(sectionKey);
    }
    showSection(sectionKey);
    if (itemId != null) {
      setTimeout(function(){ expandCard(itemId, false); }, 300);
    }
  }
  window.loadSection = loadSection;

  // Event bindings: back buttons and add buttons for all sections
  for (var key in sections) {
    (function(k){
      document.getElementById(sections[k].backBtnId).addEventListener('click', function(){
        hideSection();
      });
      if (k === 'photos') return; // photos section has custom upload button
      if (k === 'skill') return; // skill section has custom add handling
      if (k === 'aboutme') return; // aboutme section has no add button
      if (k === 'experience') return; // experience section has custom add handling
      if (k === 'journal') return; // journal section has custom add handling
      document.getElementById(sections[k].addBtnId).addEventListener('click', function(){
        currentSection = k;
        createNewItem();
      });
    })(key);
  }

  // Stack add button
  document.getElementById('skillAddBtn').addEventListener('click', function(){
    skillManager.addRow();
  });

  // Bind nav cards to their sections
  var navCardMap = {
    '项目': 'project',
    '笔记': 'note',
    '资源': 'resource',
    '随记': 'murmur',
    '技能': 'skill',
    '日志': 'journal'
  };
  var navCards = document.querySelectorAll('.nav-card');
  for (var n = 0; n < navCards.length; n++) {
    var label = navCards[n].querySelector('.nav-card-label');
    if (label && navCardMap[label.textContent.trim()]) {
      (function(sectionKey){
        navCards[n].style.cursor = 'pointer';
        navCards[n].addEventListener('click', function(){
          loadSection(sectionKey);
        });
      })(navCardMap[label.textContent.trim()]);
    }
  }

  // ===== Word Import =====
  (function(){
    var toastTimer = null;

    function showToast(msg, isError) {
      var toast = document.getElementById('wordImportToast');
      toast.textContent = msg;
      toast.className = 'word-import-toast' + (isError ? ' error' : '');
      toast.offsetHeight; // force reflow
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2500);
    }

    // Event delegation for file input (recreated on each expand)
    document.addEventListener('change', function(e){
      if (e.target && e.target.id === 'wordFileInput') {
        handleWordImport(e.target);
      }
    });

    // Event delegation for color input (recreated on each expand)
    document.addEventListener('input', function(e){
      if (e.target && e.target.id === 'wysiwygColor') {
        document.execCommand('foreColor', false, e.target.value);
        var bodyEl = document.querySelector('#detailDisplayBody');
        if (bodyEl) bodyEl.focus();
      }
    });

    // Event delegation for color palette swatches (recreated on each expand)
    document.addEventListener('click', function(e){
      var sw = e.target.closest('.color-swatch');
      if (!sw) return;
      e.preventDefault();
      e.stopPropagation();
      if (sw.classList.contains('color-swatch-add')) {
        colorPalette.addColor(function(){ refreshProjectPalette(); });
        return;
      }
      document.execCommand('foreColor', false, sw.getAttribute('data-color'));
      var bodyEl = document.querySelector('#detailDisplayBody');
      if (bodyEl) bodyEl.focus();
    });

    // Right-click on palette swatch: edit/delete menu
    document.addEventListener('contextmenu', function(e){
      var sw = e.target.closest('.color-swatch');
      if (!sw || sw.classList.contains('color-swatch-add')) return;
      var pal = sw.closest('.wysiwyg-color-palette');
      if (!pal) return;
      e.preventDefault();
      var idx = parseInt(sw.getAttribute('data-index'));
      if (isNaN(idx)) return;
      var menu = document.createElement('div');
      menu.style.cssText = 'position:fixed;z-index:9999;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.18);padding:8px;display:flex;gap:6px;left:'+e.clientX+'px;top:'+e.clientY+'px;';
      var editBtn = document.createElement('button');
      editBtn.textContent = '编辑';
      editBtn.style.cssText = 'padding:6px 14px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-family:var(--font);';
      editBtn.onclick = function(){ menu.remove(); colorPalette.editSwatch(idx, function(){ refreshProjectPalette(); }); };
      var delBtn = document.createElement('button');
      delBtn.textContent = '删除';
      delBtn.style.cssText = 'padding:6px 14px;border:1px solid #FECACA;border-radius:8px;background:#FEF2F2;color:#DC2626;cursor:pointer;font-size:12px;font-family:var(--font);';
      delBtn.onclick = function(){ menu.remove(); colorPalette.removeColor(idx, function(){ refreshProjectPalette(); }); };
      if (colorPalette.getColors().length <= 2) delBtn.style.opacity = '0.4';
      menu.appendChild(editBtn);
      menu.appendChild(delBtn);
      document.body.appendChild(menu);
      setTimeout(function(){
        document.addEventListener('click', function rm(){ menu.remove(); document.removeEventListener('click', rm); });
      }, 10);

    async function handlePdfImport(input, bodySelector) {
      var file = input.files[0];
      if (!file) return;
      showToast('正在渲染PDF...');
      await loadPdfLib();
      var reader = new FileReader();
      reader.onload = function(e){
        pdfjsLib.getDocument({data: e.target.result}).promise.then(function(pdf){
          var todo = pdf.numPages;
          var images = [];
          for (var p = 1; p <= pdf.numPages; p++) {
            (function(num){
              pdf.getPage(num).then(function(page){
                var scale = 2;
                var viewport = page.getViewport({scale: scale});
                var canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                var ctx = canvas.getContext('2d');
                return page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
                  // 每页先试上传到图床（存 URL），失败再降级 base64
                  return new Promise(function(res){
                    canvas.toBlob(function(blob){
                      if (!blob) { res(null); return; }
                      putImageBlob(blob).then(res);
                    }, 'image/webp', 0.8);
                  }).then(function(remoteUrl){
                  var src = remoteUrl;
                  if (!src) {
                    src = canvas.toDataURL('image/webp', 0.85);
                    if (!src || src.indexOf('image/webp') === -1) src = canvas.toDataURL('image/png');
                  }
                  images[num - 1] = '<img src="' + src + '" style="display:block;width:100%;max-width:100%;margin-bottom:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">';
                  todo--;
                  if (todo === 0) {
                    var bodyEl = document.querySelector(bodySelector);
                    if (bodyEl && bodyEl.isContentEditable) {
                      bodyEl.innerHTML = images.join('');
                      bodyEl.focus();
                      showToast('导入成功！共 ' + pdf.numPages + ' 页');
                    } else {
                      showToast('请先进入编辑模式再导入', true);
                    }
                  }
                  });
                });
              });
            })(p);
          }
        }).catch(function(err){
          console.error(err);
          showToast('PDF解析失败', true);
        });
        input.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

  function doSearchList(q, filter) {
    var sl = document.getElementById('searchResultList');
    if (!sl) return;
    var items = [];
    var map = {
      project: { key: 'my_project_data', type: '项目' },
      note: { key: 'my_note_data', type: '笔记' },
      resource: { key: 'my_resource_data', type: '资源' },

      journal: { key: 'my_journal_data', type: '日志' },
      skill: { key: 'my_skill_data', type: '技能' },
      experience: { key: 'my_experience_data', type: '经历' }
    };
    var ql = (q || '').toLowerCase();
    for (var name in map) {
      if (filter && name !== filter) continue;
      var s = map[name];
      try {
        var raw = localStorage.getItem(s.key);
        if (!raw) continue;
        var data = JSON.parse(raw);
        var arr = Array.isArray(data) ? data : (data.items || []);
        for (var i = 0; i < arr.length; i++) {
          var item = arr[i];
          var title = item.title || item.name || '';
          var desc = item.desc || item.body || item.note || '';
          if (title.toLowerCase().indexOf(ql) >= 0 || desc.toLowerCase().indexOf(ql) >= 0) {
            items.push({ sectionName: name, type: s.type, title: title, desc: desc.replace(/<[^>]*>/g, ''), id: item.id });
          }
        }
      } catch(e) {}
    }
    if (items.length === 0) {
      sl.innerHTML = '<div class="search-result-empty">未找到相关内容</div>';
      return;
    }
    var html = '';
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      html += '<div class="search-result-row" data-section="' + it.sectionName + '" data-id="' + (it.id || '') + '">';
      html += '<div class="search-result-row-info"><div class="search-result-row-title">' + escS(it.title || '(无标题)') + '</div><div class="search-result-row-desc">' + (it.desc || '') + '</div></div>';
      html += '<span class="search-result-row-badge">' + it.type + '</span></div>';

    function parseHonorTime(timeStr) {
      if (!timeStr) return { endDate: '0000', isMonthOnly: false };
      var t = timeStr.trim().replace(/\./g, '-').replace(/[\/]/g, '-');
      var range = t.match(/(\d{4}-\d{2}-\d{2}|\d{4}-\d{2})\s*[-–—~至]\s*(\d{4}-\d{2}-\d{2}|\d{4}-\d{2})/);
      if (range) {
        var end = normalizeHonorDate(range[2]);
        return { endDate: end.val, isMonthOnly: end.monthOnly };
      }
      return normalizeHonorDate(t);
    }
    function normalizeHonorDate(s) {
      if (/^\d{4}-\d{2}$/.test(s)) return { val: s + '-00', isMonthOnly: true };
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return { val: s, isMonthOnly: false };
      var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m) return { val: m[1] + '-' + m[2] + '-' + m[3], isMonthOnly: false };
      m = s.match(/(\d{4})-(\d{2})/);
      if (m) return { val: m[1] + '-' + m[2] + '-00', isMonthOnly: true };
      m = s.match(/(\d{4})/);
      if (m) return { val: m[1] + '-00-00', isMonthOnly: false };
      return { val: '0000-00-00', isMonthOnly: false };
    }

    }

    function getSortedItems() {
      var sorted = items.slice();
      sorted.sort(function(a, b){ return b.date.localeCompare(a.date); });
      return sorted;
    }

    function getYearMonthOptions() {
      var years = {};
      for (var i = 0; i < items.length; i++) {
        var d = items[i].date;
        if (!d || d.length < 7) continue;
        var y = parseInt(d.substring(0, 4));
        var m = parseInt(d.substring(5, 7));
        if (!years[y]) years[y] = {};
        years[y][m] = true;
      }
      var result = [];
      var yKeys = Object.keys(years).sort(function(a,b){ return b - a; });
      for (var yi = 0; yi < yKeys.length; yi++) {
        var y = parseInt(yKeys[yi]);
        var months = Object.keys(years[y]).sort(function(a,b){ return b - a; });
        result.push({ year: y, months: months.map(function(m){ return parseInt(m); }) });
      }
      return result;
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr.length < 10) return dateStr;
      var parts = dateStr.split('-');
      var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
      return {
        monthDay: months[parseInt(parts[1]) - 1] + ' ' + parseInt(parts[2]) + '日',
        year: parts[0],
        full: dateStr
      };
    }

    function getNowTime() {
      var d = new Date();
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

          var targetYear = this.getAttribute('data-year');
          scrollToYearMonth(targetYear, null);
          dropdown.classList.remove('show');
        });
      }
      var monthBtns = dropdown.querySelectorAll('.journal-calendar-month');
      for (var mi = 0; mi < monthBtns.length; mi++) {
        monthBtns[mi].addEventListener('click', function(e){
          e.stopPropagation();
          var targetYear = this.getAttribute('data-year');
          var targetMonth = this.getAttribute('data-month');
          scrollToYearMonth(targetYear, targetMonth);
          dropdown.classList.remove('show');
        });
      }
    }

    function scrollToYearMonth(year, month) {
      var container = document.getElementById('journalContainer');
      var entries = document.querySelectorAll('#journalTimeline .journal-entry');
      if (!container || entries.length === 0) return;

      // Find the first entry matching year (and optionally month)
      var targetEl = null;
      for (var i = 0; i < entries.length; i++) {
        var entryDate = entries[i].getAttribute('data-date');
        if (!entryDate) continue;
        var entryYear = entryDate.substring(0, 4);
        var entryMonth = entryDate.substring(5, 7);
        if (entryYear === year) {
          if (!month || entryMonth === month) {
            targetEl = entries[i];
            break;
          }
        }
      }

      if (targetEl) {
        // Scroll the entry to top of container with a small offset
        var containerRect = container.getBoundingClientRect();
        var targetRect = targetEl.getBoundingClientRect();
        var offset = targetRect.top - containerRect.top + container.scrollTop - 16;
        container.scrollTo({ top: offset, behavior: 'smooth' });
      }
    }

    // Calendar button toggle
    var calendarBtn = document.getElementById('journalCalendarBtn');
    if (calendarBtn) {
      calendarBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var dropdown = document.getElementById('journalCalendarDropdown');
        buildCalendarDropdown();
        dropdown.classList.toggle('show');
      });
    }

    // Close dropdown on outside click
    document.addEventListener('click', function(e){
      var dropdown = document.getElementById('journalCalendarDropdown');
      var btn = document.getElementById('journalCalendarBtn');
      if (dropdown && btn && !btn.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    load();

    return { render: render, openEditor: openEditor, load: load };
  })();

  // 云端同步后重载 section 数据（清缓存 + 重读三个 manager）
  window.reloadAllSections = function() {
    data = {};
    nextId = {};
    // 先给每个栏目重建空数组和初始 nextId，避免空栏目 nextId 变成 undefined
    for (var rk in sections) { data[rk] = []; nextId[rk] = 1; }
    if (skillManager.load) skillManager.load();
    if (experienceManager.load) experienceManager.load();
    if (journalManager.load) journalManager.load();
    // 重新加载 project/note/resource/murmur 数据（避免 data 处于 undefined 状态）
    loadSectionData('project');
    loadSectionData('note');
    loadSectionData('resource');
    loadSectionData('murmur');
  };

})();
</script>



<script>
// Like button with server-side counter
(function(){
  var likeBtn = document.getElementById('likeBtn');
  if (!likeBtn) return;
  var likeCount = document.getElementById('likeCount');
  var heartImg = likeBtn.querySelector('.heart-img');

  // 一次性清空点赞数（历史测试数据归零，之后正常从 0 累加）
  if (!localStorage.getItem('__likeResetOnce')) {
    localStorage.setItem('__likeResetOnce', '1');
    localStorage.removeItem('hasLikedWeiDL');
    localStorage.setItem('weiLikeCount', '0');
  }

  var savedCount = parseInt(localStorage.getItem('weiLikeCount')) || 0;
  likeCount.textContent = savedCount;

  // 刷新后根据 hasLikedWeiDL 恢复爱心图标状态
  if (localStorage.getItem('hasLikedWeiDL')) {
    likeBtn.classList.add('liked');
    if (heartImg) heartImg.src = ICON_RED_HEART;
  } else {
    likeBtn.classList.remove('liked');
    if (heartImg) heartImg.src = ICON_GREY_HEART;
  }

  likeBtn.addEventListener('click', function(){
    if (localStorage.getItem('hasLikedWeiDL')) {
      likeBtn.classList.remove('liked');
      if (heartImg) heartImg.src = ICON_GREY_HEART;
      localStorage.removeItem('hasLikedWeiDL');
      var n = parseInt(likeCount.textContent) - 1;
      if (n < 0) n = 0;
      likeCount.textContent = n;
      localStorage.setItem('weiLikeCount', n);
    } else {
      likeBtn.classList.add('liked');
      if (heartImg) heartImg.src = ICON_RED_HEART;
      localStorage.setItem('hasLikedWeiDL', '1');
      var n = parseInt(likeCount.textContent) + 1;
      likeCount.textContent = n;
      localStorage.setItem('weiLikeCount', n);
    }
  });
})();

function goBackToGrid(btn) {
  // Block while editing (save or cancel first)
  if (typeof isEditing !== 'undefined' && isEditing) return;
  var card = btn.closest('.project-card.expanded');
  if (!card) return;
  card.classList.remove('expanded');
  var grid = card.parentElement;
  if (!grid) return;
  grid.classList.remove('has-expanded');

    all[i].classList.remove('expanded');

<script>// Lightbox image viewer
(function(){
  var overlay = document.getElementById('lightboxOverlay');
  var imgEl = document.getElementById('lightboxImg');
  var counter = document.getElementById('lightboxCounter');
  var thumbs = document.getElementById('lightboxThumbs');
  var images = [];
  var curIdx = 0;
  var scale = 1, originX = 0, originY = 0, panX = 0, panY = 0;
  var isDragging = false, dragStartX = 0, dragStartY = 0, startPanX = 0, startPanY = 0;

  function resetZoom() {
    scale = 1; panX = 0; panY = 0;
    imgEl.style.transform = 'scale(1) translate(0,0)';
    imgEl.style.cursor = 'zoom-in';
  }

  document.addEventListener('dblclick', function(e){
    var img = e.target.closest('img');
    if (!img) return;
    if (!img.closest('#detailDisplayBody') && !img.closest('#aboutMeBody')) return;
    e.preventDefault();
    e.stopPropagation();
    var container = img.closest('#detailDisplayBody,#aboutMeBody');
    if (!container) return;
    var allImgs = container.querySelectorAll('img');
    images = [];
    for (var i = 0; i < allImgs.length; i++) {
      images.push(allImgs[i].src);
      if (allImgs[i] === img) curIdx = i;
    }
    if (images.length === 0) return;
    openLightbox(curIdx);
  });

  function openLightbox(idx) {
    curIdx = idx;
    resetZoom();
    updateView();
    overlay.classList.add('show');
  }

  function closeLightbox() {
    overlay.classList.remove('show');
    resetZoom();
  }

  function updateTransform() {
    imgEl.style.transform = 'scale(' + scale + ') translate(' + panX + 'px,' + panY + 'px)';
  }

  function updateView() {
    imgEl.src = images[curIdx];
    counter.textContent = (curIdx + 1) + ' / ' + images.length;
    resetZoom();
    thumbs.innerHTML = '';
    for (var i = 0; i < images.length; i++) {
      var t = document.createElement('img');
      t.src = images[i];
      t.className = (i === curIdx) ? 'active' : '';
      (function(idx){ t.addEventListener('click', function(){ curIdx = idx; resetZoom(); updateView(); }); })(i);
      thumbs.appendChild(t);
    }
    var active = thumbs.querySelector('.active');
    if (active) active.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
  }

  // Mouse wheel zoom
  imgEl.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect = imgEl.getBoundingClientRect();
    var mx = e.clientX - rect.left - rect.width / 2;
    var my = e.clientY - rect.top - rect.height / 2;
    var oldScale = scale;
    var delta = e.deltaY > 0 ? -0.15 : 0.15;
    scale = Math.max(0.5, Math.min(5, scale + delta));
    var ratio = scale / oldScale;
    panX = panX * ratio - mx * (ratio - 1) / oldScale;
    panY = panY * ratio - my * (ratio - 1) / oldScale;
    imgEl.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
    updateTransform();
  });

  // Track drag distance + click zoom
  var dragMoved = false;
  imgEl.addEventListener('mousedown', function(e){
    if (scale <= 1) return;
    e.preventDefault();
    isDragging = true;
    dragMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    imgEl.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', function(e){
    if (!isDragging) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    panX = startPanX + dx / scale;
    panY = startPanY + dy / scale;
    updateTransform();
  });
  document.addEventListener('mouseup', function(){
    if (isDragging) { imgEl.style.cursor = scale > 1 ? 'grab' : 'zoom-in'; }
    isDragging = false;
  });
  imgEl.addEventListener('click', function(e){
    if (dragMoved) return;
    if (scale > 1.1) { resetZoom(); }
    else {
      scale = 2;
      var rect = imgEl.getBoundingClientRect();
      panX = -(e.clientX - rect.left - rect.width/2) / 2;
      panY = -(e.clientY - rect.top - rect.height/2) / 2;
      imgEl.style.cursor = 'grab';
      updateTransform();
    }
  });
  // Touch pinch zoom
  var lastPinchDist = 0;
  imgEl.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  });
  imgEl.addEventListener('touchmove', function(e){
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      var ratio = dist / lastPinchDist;
      scale = Math.max(0.5, Math.min(5, scale * ratio));
      lastPinchDist = dist;
      imgEl.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
      updateTransform();
    }
  }, {passive: false});

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeLightbox(); });
  document.getElementById('lightboxPrev').addEventListener('click', function(){
    curIdx = (curIdx - 1 + images.length) % images.length;
    updateView();
  });
  document.getElementById('lightboxNext').addEventListener('click', function(){
    curIdx = (curIdx + 1) % images.length;
    updateView();
  });
  document.addEventListener('keydown', function(e){
    if (!overlay.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { curIdx = (curIdx - 1 + images.length) % images.length; updateView(); }
    if (e.key === 'ArrowRight') { curIdx = (curIdx + 1) % images.length; updateView(); }
  });
})();

// ===== 云端数据更新后，不整页刷新，直接重载各模块 =====
window.refreshAllData = function() {

};

}
